      security: [{ SessionCookie: [] }, { ApiKeyBearer: [] }]
      x-api-permissions: ['pantry:create']
      x-api-key-scope: pantry.create
      operationId: createPantryBatch
      summary: Add a physical Pantry batch
      description: >-
        When an Idempotency-Key is supplied, the acknowledged response is retained beyond
        24 hours and replayed only for the same authorized account/profile and original intent.
        A confirmation explicitly closed through the recovery endpoint returns 409 without
        another stock write. No key still means no durable replay guarantee.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ReviewedAccount' }
        - { $ref: '#/components/parameters/ReviewedProfile' }
      requestBody:
        required: true

  /kitchen:
    get:
      operationId: readKitchenInventory
      summary: Read the household physical equipment inventory
      description: >-
        Household reads require shared.read; mutations recheck live account and active-profile permissions.
        Session mutations require an exact trusted origin. Equipment commands are actor-bound and replayable.
        Kitchen integration commands require kitchen:update plus create/delete for the relevant effect and kitchen:read.
      responses:
        '200':
          description: Current state or acknowledged operation
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: Invalid bounded fields }
        '403': { description: 'Account, profile, scope or origin rejected' }
        '409':
          {
            description: 'Stale revision, mismatched replay intent or resource in use; retain draft and refresh review',
          }
    post:
      operationId: changeKitchenEquipment
      summary: Apply a reviewed versioned equipment command
      description: >-
        Household reads require shared.read; mutations recheck live account and active-profile permissions.

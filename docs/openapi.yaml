        mealExpectedUpdatedAt: { type: string, format: date-time }
        id: { type: string, maxLength: 80 }
        recipeId: { type: string, format: uuid }
        recipeRevision: { type: integer, minimum: 1 }
        stepRefs:
          {
            type: array,
            minItems: 1,
            maxItems: 80,
            items: { type: string, maxLength: 80 },
            description: Actual step IDs for the exact recipe revision,

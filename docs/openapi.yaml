        name: { type: string, minLength: 1, maxLength: 80 }
        constraints:
          type: object
          additionalProperties: false
          properties:
            preparationSpace: { type: string, enum: [unknown, limited, standard] }
            equipmentStorage: { type: string, enum: [unknown, limited, standard] }
    KitchenCavityLoad:
      type: object
      additionalProperties: false
      required: [widthMm, depthMm, heightMm]
      description: Measured dish footprint including user-confirmed placement clearance, in millimetres. Cavity co-use requires recorded usable cavity width/depth/height, matching confirmed mode and temperature, and combined same-level strip fit. No shelves, stacking, rotation, safety limits or completion time are inferred. Omission keeps cavity use exclusive.
      properties:
        widthMm: { type: integer, minimum: 1, maximum: 10000 }
        depthMm: { type: integer, minimum: 1, maximum: 10000 }
        heightMm: { type: integer, minimum: 1, maximum: 10000 }
    KitchenPhase:
      type: object

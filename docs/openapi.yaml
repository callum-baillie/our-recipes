  /food-data/confirmations/recovery:
    post:
      security: [{ SessionCookie: [] }, { ApiKeyBearer: [] }]
      x-api-permissions: ['pantry:create']
      x-api-key-scope: pantry.create
      operationId: reconcileReviewedFoodConfirmation
      summary: Inspect or close an original reviewed food confirmation without changing stock or cart
      description: >-
        Requires current Pantry create authority, the original account and viewing profile,
        and the exact original command. Shopping recovery also requires its original shopping create/update permissions. Inspection never retries a write.
        An absent receipt has an unknown historical outcome. Explicit abandonment stores
        a durable tombstone that blocks future execution of the original key and command;
        it does not undo previous stock or cart changes. Matching acknowledged receipts are returned
        before contacting the provider or inspecting current product, location or list availability.
        Receipts and closures for these confirmation routes are retained beyond the generic
        24-hour create-request window. Inspect and abandon validate the same original actor,
        operation and normalized intent; an uncertain operation must not be replaced with a new key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, action, actor, commandPath, command]
              properties:
                operationId: { type: string, format: uuid }
                action: { type: string, enum: [inspect, abandon] }
                actor:
                  type: object
                  additionalProperties: false
                  required: [userId, profileId]
                  properties:
                    userId: { type: string, minLength: 1 }
                    profileId: { type: string, format: uuid }
                commandPath:
                  type: string
                  description: Original whitelisted confirmation route; never an arbitrary URL.
                  pattern: '^/api/v1/(pantry/(batches|catalog-imports)|shopping-lists/[0-9a-fA-F-]{36}/catalog-items)$'
                command:
                  oneOf:
                    - { $ref: '#/components/schemas/PantryBatchInput' }
                    - { $ref: '#/components/schemas/CatalogPantryImportInput' }
                    - { $ref: '#/components/schemas/CatalogShoppingInput' }
                  description: >-
                    Exact original JSON, strictly validated for commandPath. Local batches use
                    PantryBatchInput. Catalog Pantry imports use the catalog import selection/product
                    schema plus 1–20 valid batch drafts. Shopping catalog-items use the existing
                    localProductId or reviewed source union with cartQuantity/cartUnit and reviewed
                    item/version when replacing. Its operationId must match this recovery request.
      responses:
        '200':
          description: Original acknowledgement, no retained receipt, or durable abandonment
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [acknowledged, not_recorded, abandoned] }
                  outcome: { type: string, enum: [unknown] }
                  message: { type: string }
                  result:
                    type: object
                    description: Original acknowledged batch, catalog import or shopping confirmation response
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { description: Authentication missing or revoked }
        '403': { description: 'Original account, current permission, or trusted origin required' }
        '409': { description: Original viewing profile or exact original intent does not match }

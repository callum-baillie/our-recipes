        '429': { description: Print queue is busy }
  /shopping-lists/recent-items:
    get:
      security: [{ SessionCookie: [] }, { ApiKeyBearer: [] }]
      x-api-permissions: ['shoppingLists:read']
      operationId: listRecentShoppingItems
      summary: Recently purchased household items for Buy again
      responses:
        '200':
          description: Up to 30 distinct names from the last 500 recorded purchases
          content:
            application/json:
              schema:
                { type: object, properties: { items: { type: array, items: { type: object } } } }
        '403': { $ref: '#/components/responses/UntrustedOrigin' }
  /shopping-lists/{listId}/items/bulk:
    post:
      security: [{ SessionCookie: [] }, { ApiKeyBearer: [] }]
      x-api-permissions: ['shoppingLists:create']
      operationId: addShoppingListNamesBulk
      summary: Add up to 100 item names atomically, skipping existing active names
      parameters:
        - { name: listId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 100,
                    items: { type: string, minLength: 1, maxLength: 160 },
                  }
      responses:
        '201':
          description: Added items and the number of skipped names
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    { items: { type: array, items: { type: object } }, skipped: { type: integer } },
                }
        '400': { $ref: '#/components/responses/InvalidRequest' }

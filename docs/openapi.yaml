  /ai/prompts:
    get:
      operationId: listAiPromptGuidance
      summary: Inspect installation task guidance and version history
      description: Administrator session only. Default returns seven effective templates and up to ten revisions each. Use workload and before for older pages. Preview never includes private records or invokes a provider.
      parameters:
        - {
            in: query,
            name: workload,
            schema:
              {
                type: string,
                enum:
                  [
                    chat,
                    recipe_review,
                    recipe_generation,
                    meal_plan_generation,
                    nutrition_estimation,
                    nutrition_summary,
                    image_generation,
                  ],
              },
          }
        - { in: query, name: before, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          {
            description: Effective guidance or a bounded history page,
            content: { application/json: { schema: { type: object } } },
          }
        '401': { description: Signed out }
        '403': { description: Installation administrator required }
    put:
      operationId: saveAiPromptGuidance
      summary: Activate a validated new task-guidance version
      description: Administrator session and exact trusted origin required. A rollback copies older guidance into a new version; expectedVersion prevents overwriting a competing edit. Immutable authorization and output schemas cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workload, expectedVersion, template, changeNote]
              properties:
                workload:
                  {
                    type: string,
                    enum:
                      [
                        chat,
                        recipe_review,
                        recipe_generation,
                        meal_plan_generation,
                        nutrition_estimation,
                        nutrition_summary,
                        image_generation,
                      ],
                  }
                expectedVersion: { type: integer, minimum: 0 }
                template:
                  {
                    type: string,
                    minLength: 20,
                    maxLength: 6000,
                    description: 'Must contain {{task}} and no unsupported variables.',
                  }
                changeNote: { type: string, minLength: 3, maxLength: 400 }
      responses:
        '200':
          {
            description: New authoritative prompt version,
            content: { application/json: { schema: { type: object } } },
          }
        '400': { description: Invalid template variables or fields }
        '401': { description: Signed out }
        '403': { description: Administrator or trusted origin required }
        '409': { description: Version changed; retain draft and compare current guidance }
  /ai/chat/threads:
    get:
      operationId: listMyAiConversations
      summary: List account-owned conversations
      description: Session only. The linked account owns this private workspace; viewing another household person does not grant access to their conversations.
      responses:
        '200':
          {
            description: Recent conversation identities,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            threads:
                              {
                                type: array,
                                items:
                                  {
                                    type: object,
                                    properties:
                                      {
                                        id: { type: string, format: uuid },
                                        title: { type: string },
                                      },
                                  },
                              },
                          },
                      },
                  },
              },
          }
        '401': { description: Signed out }
        '403': { description: Switch to your own account profile }
    post:
      operationId: createMyAiConversation
      summary: Start an account-owned conversation without making a provider request
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    properties: { title: { type: string, minLength: 1, maxLength: 80 } },
                  },
              },
          }
      responses:
        '201':
          {
            description: Conversation created,
            content: { application/json: { schema: { type: object } } },
          }
        '400': { description: Invalid title }
        '401': { description: Signed out }
        '403': { description: 'Account scope, AI policy or trusted origin denied' }
  /ai/chat/threads/{threadId}:
    parameters:
      - { in: path, name: threadId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readMyAiConversation
      parameters:
        - in: query
          name: operationId
          required: false
          schema: { type: string, format: uuid }
          description: Exact owned request lookup, including a receipt older than the latest thirty turns.
      summary: Reconcile saved messages, previews, jobs and request outcomes
      description: Session only; only the linked account's own thread. Turn receipts expose id, status, createdAt and updatedAt, never intent hashes or stored result payloads. A running receipt may require outcome reconciliation; it does not establish failure.
      responses:
        '200':
          {
            description: Authoritative saved conversation and up to thirty request receipts,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            messages: { type: array, items: { type: object } },
                            actions: { type: array, items: { type: object } },
                            jobs: { type: array, items: { type: object } },
                            turns:
                              {
                                type: array,
                                maxItems: 30,
                                items:
                                  {
                                    type: object,
                                    properties:
                                      {
                                        id: { type: string, format: uuid },
                                        status:
                                          {
                                            type: string,
                                            enum:
                                              [
                                                running,
                                                completed,
                                                failed,
                                                cancelled,
                                                outcome_unknown,
                                              ],
                                          },
                                        createdAt: { type: string, format: date-time },
                                        updatedAt: { type: string, format: date-time },
                                      },
                                  },
                              },
                          },
                      },
                  },
              },
          }
        '401': { description: Signed out }
        '403': { description: Account does not own this private workspace }
        '404': { description: Conversation not found }
    patch:
      operationId: acknowledgeMyAiRecovery
      summary: Acknowledge review of an interrupted private request
      description: Session and trusted origin required. Reconciles an expired lease and marks its outputs reviewed, without replaying provider work. If the exact operation has no receipt, writes a reviewed tombstone so a delayed original request cannot start. An active request must finish or expire first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, operationId]
              properties:
                action: { type: string, const: acknowledge_recovery }
                operationId: { type: string, format: uuid }
      responses:
        '200': { description: Recovery reviewed; no writes or paid calls repeated }
        '400': { description: Invalid recovery command or request still active }
        '401': { description: Signed out }
        '403': { description: Account or trusted origin denied }
        '404': { description: Conversation or operation is not owned by this account }
    delete:
      operationId: deleteMyAiConversation
      summary: Delete an account-owned conversation
      responses:
        '204': { description: Conversation deleted }
        '401': { description: Signed out }
        '403': { description: Account or trusted origin denied }
        '404': { description: Conversation not found }
  /ai/chat/threads/{threadId}/messages:
    parameters:
      - { in: path, name: threadId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: streamMyAiConversationTurn
      summary: Stream a bounded provider turn with a durable exact request identity
      description: >-
        Session and trusted origin required. Send one operationId for the normalized message, attachments and tool consent; reuse that same intent after a lost response. A completed operation replays its saved result before contacting the provider. Running, failed, cancelled or outcome-unknown attempts require conversation reconciliation and never automatically repeat provider work.
        Events have increasing sequence numbers and types status, text_reset, text, action, job, suggestion, app_action, error and done. Text deltas arrive while the provider is working; done contains canonical saved content. A stream ending without done is incomplete. Closing or stopping never undoes an acknowledged job or proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                operationId: { type: string, format: uuid }
                message: { type: string, maxLength: 8000 }
                allowPaidTools: { type: boolean, default: false }
                attachments: { type: array, maxItems: 20, items: { type: object } }
      responses:
        '200':
          {
            description: Incremental UTF-8 NDJSON; an error event is not completion,
            content: { application/x-ndjson: { schema: { type: string } } },
          }
        '400': { description: Invalid bounded message or attachment }
        '401': { description: Signed out }
        '403': { description: 'Session, account, sharing or AI policy denied' }
        '404': { description: Conversation not found }
        '429': { description: Account request budget reached }
  /ai/actions/{actionId}/image:
    parameters:
      - { in: path, name: actionId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readMyDraftImage
      summary: Read a private image tied to the current owned recipe draft
      responses:
        '200':
          description: Private image; never cache publicly
          content:
            image/webp:
              schema: { type: string, format: binary }
        '401': { description: Signed out }
        '403': { description: Account does not own the private draft }
        '404': { description: 'Image absent, legacy provenance missing, or draft changed' }
    post:
      operationId: prepareMyDraftImage
      summary: Explicitly authorize a separate paid image for a reviewed draft
      description: Session and trusted origin required. Text drafting does not invoke this operation. Exact operation/draft/owner replay returns the saved receipt before provider access. Saving the recipe transfers a ready private image to a revision-bound candidate; a separate accept action selects it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, operationId, expectedSourceDigest]
              properties:
                confirm: { type: boolean, const: true }
                operationId: { type: string, format: uuid }
                expectedSourceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200': { description: Current owned action and image-request status }
        '400': { description: Missing explicit authorization or invalid reviewed intent }
        '401': { description: Signed out }
        '403': { description: 'Owner, workload, sharing or trusted origin denied' }
        '404': { description: Draft is unavailable }
        '409': { description: 'Draft changed, closed, or has an unresolved image request' }
        '503':
          {
            description: Generation did not finish; reconcile the exact request before a new paid request,
          }
  /ai/app-actions:
    get:
      operationId: listMyReviewedAiActions
      summary: Reconcile account-owned proposals and per-step outcomes
      description: >-
        Each newly prepared action includes optional versioned review metadata (schemaVersion1):
        a named subject, effect, context label/value pairs, before/after changes and caveats.
        This bounded presentation is derived from the same authorized responses whose hashes
        guard application; model proposal titles and raw record identifiers are not target labels.
        Existing saved JSON without review metadata remains readable, but non-image pending
        proposals require a fresh review before application. Completed-result replay is preserved.
      parameters:
        - { in: query, name: threadId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: Pending and handled proposals with results,
            content: { application/json: { schema: { type: object } } },
          }
        '401': { description: Signed out }
        '403': { description: AI access denied }
    post:
      operationId: confirmMyReviewedAiActions
      summary: Apply or dismiss the exact reviewed proposal
      description: >-
        Revalidates actor, permissions, sharing, source versions and dependency contracts before execution. Steps execute in order using server-bound output IDs. A failure stops later steps; only acknowledged steps are completed. Lost mutation outcomes are reported as outcome-unknown and are not automatically retried. Repeating an acknowledged confirmation returns stored results without repeating writes. Image groups require explicit paid confirmation and are queued separately. They prepare private image candidates for a later acceptance step; existing photos are unchanged. Pending non-image proposals without current named review metadata return409 and require a fresh review.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [id, version, decision],
                    properties:
                      {
                        id: { type: string, format: uuid },
                        version: { type: integer, minimum: 1 },
                        decision: { type: string, enum: [apply, dismiss] },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: 'Applied, partial, queued or dismissed with per-step outcomes',
            content: { application/json: { schema: { type: object } } },
          }
        '400': { description: Invalid reviewed command }
        '401': { description: Signed out }
        '403': { description: Authority or sharing changed }
        '409': { description: 'Proposal expired, superseded, busy or source changed' }
    put:
      operationId: reviseMyReviewedAiActions
      summary: Prepare edited values as a new proposal and supersede the previous review
      description: No domain mutation occurs. Existing operation IDs, targets and dependency bindings are retained. Inputs and current source snapshots are revalidated. Applying the superseded review is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, version, title, bodyEdits]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 160 }
                bodyEdits:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [step, bodyJson],
                      properties:
                        {
                          step: { type: integer, minimum: 0, maximum: 19 },
                          bodyJson: { type: string, minLength: 2, maxLength: 60000 },
                        },
                    }
      responses:
        '200':
          {
            description: Fresh review; previous proposal is inactive,
            content: { application/json: { schema: { type: object } } },
          }
        '400': { description: Invalid replacement values }
        '401': { description: Signed out }
        '403': { description: Authority or sharing changed }
        '409': { description: Proposal version changed or was handled }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth browser session. Secure deployments may use the __Secure- prefix.
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: bord_sk
      description: >-
        Admin-created integration key. The raw secret is displayed once, expires within 365 days,
        and is accepted only on the scoped integration resource paths.
    HomepageBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque integration token
  parameters:
    EffectiveRecipeSession:
      name: sessionId
      in: query
      description: Export the signed-in account's owned effective cooking snapshot; mutually exclusive with mealEntryId. API keys cannot export private cooking sessions. No physical assignments or household resource IDs are included.
      schema: { type: string, format: uuid }
    EffectiveRecipeMeal:
      name: mealEntryId
      in: query
      description: Export this planned meal's effective recipe, leaving the library unchanged. API keys also need mealPlans:read. Mutually exclusive with sessionId.
      schema: { type: string, format: uuid }
    ReviewedAccount:
      name: X-Bord-Expected-User-Id
      in: header
      required: false
      description: Original account ID returned by auth/context. Compared with the authenticated principal before reviewed confirmation or replay; mismatch is 409 and malformed input is 400. Independently optional for compatibility; current scanner clients send both account and profile headers.
      schema: { type: string, minLength: 1, maxLength: 256 }
    ReviewedProfile:
      name: X-Bord-Expected-Profile-Id
      in: header
      required: false
      description: Original viewing profile returned by auth/context. Compared with the authenticated principal before reviewed confirmation or replay; mismatch is 409 and malformed input is 400. Does not authenticate a profile or grant authority.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Required for the documented core resource creation endpoints that reference this parameter. Reusing a key with the same body replays the stored
        response for 24 hours; reusing it with another body returns 409.
      schema: { type: string, minLength: 1, maxLength: 128 }
    UpdatedSince:
      name: updatedSince
      in: query
      required: false
      description: Return items updated after this timestamp.
      schema: { type: string, format: date-time }
    IncludeInactive:
      name: includeInactive
      in: query
      required: false
      schema: { type: boolean, default: false }
  schemas:
    ScannerReceipt:
      {
        'type': 'object',
        'required': ['operationId', 'type', 'message'],
        'properties':
          {
            'contractVersion': { 'type': 'integer', 'const': 2 },
            'operationId': { 'type': 'string', 'format': 'uuid' },
            'stationId': { 'type': 'string' },
            'bindingId': { 'type': 'string', 'format': 'uuid' },
            'instanceId': { 'type': 'string', 'format': 'uuid' },
            'type': { 'type': 'string' },
            'outcome': { 'type': 'string', 'enum': ['succeeded', 'needs_review'] },
            'message': { 'type': 'string' },
            'replayed': { 'type': 'boolean' },
            'recordedAt': { 'type': 'string', 'format': 'date-time' },
            'undoable': { 'type': 'boolean' },
            'productName': { 'type': 'string' },
            'quantity': { 'type': 'number' },
            'unit': { 'type': 'string' },
            'cookSessionId': { 'type': 'string', 'format': 'uuid' },
            'batchId': { 'type': 'string', 'format': 'uuid' },
            'error':
              {
                'type': 'object',
                'properties': { 'code': { 'type': 'string' }, 'message': { 'type': 'string' } },
              },
          },
        'additionalProperties': true,
        'description': 'A v2 receipt includes the complete instance/station/actor binding and outcome. Legacy replay-only receipts may lack v2 metadata. Match the binding, UUID and type before acknowledging delivery.',
      }
    ScannerBoundOperation:
      {
        'type': 'object',
        'properties':
          {
            'contractVersion': { 'type': 'number', 'const': 2 },
            'operationId':
              {
                'type': 'string',
                'format': 'uuid',
                'pattern': '^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$',
              },
            'stationId': { 'type': 'string', 'pattern': '^[a-zA-Z0-9_-]{1,64}$' },
            'instanceId':
              {
                'type': 'string',
                'format': 'uuid',
                'pattern': '^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$',
              },
            'bindingId':
              {
                'type': 'string',
                'format': 'uuid',
                'pattern': '^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$',
              },
            'command':
              {
                'anyOf':
                  [
                    {
                      'oneOf':
                        [
                          {
                            'type': 'object',
                            'properties':
                              {
                                'type': { 'type': 'string', 'const': 'recipe' },
                                'recipeId':
                                  {

    WorkflowPreferencesInput:
      oneOf:
        - type: object
          properties:
            category:
              type: string
              const: recipes
            values:
              type: object
              properties:
                defaultSort:
                  type: string
                  enum:
                    - recently-added
                    - recently-updated
                    - alphabetical
                    - most-recently-cooked
                    - shortest-time
                    - highest-rated
                defaultServings:
                  type: integer
                  minimum: 1
                  maximum: 100
              required:
                - defaultSort
                - defaultServings
              additionalProperties: false
          required:
            - category
            - values
          additionalProperties: false
        - type: object
          properties:
            category:
              type: string
              const: mealPlan
            values:
              type: object
              properties:
                weekStartsOn:
                  anyOf:
                    - type: number
                      const: 0
                    - type: number
                      const: 1
                defaultDuration:
                  anyOf:
                    - type: number
                      const: 3
                    - type: number
                      const: 5
                    - type: number
                      const: 7
                    - type: number
                      const: 14
                defaultMealTypes:
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 48
                    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                visibleMealTypes:
                  default:
                    - breakfast
                    - lunch
                    - dinner
                    - dessert
                    - snack
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 48
                    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                customMealTypes:
                  default: []
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      value:
                        type: string
                        minLength: 1
                        maxLength: 48
                        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                      label:
                        type: string
                        minLength: 1
                        maxLength: 48
                    required:
                      - value
                      - label
                    additionalProperties: false
              required:
                - weekStartsOn
                - defaultDuration
                - defaultMealTypes
              additionalProperties: false
          required:
            - category
            - values
          additionalProperties: false
        - type: object
          properties:
            category:
              type: string
              const: pantry
            values:
              type: object
              properties:
                defaultView:
                  type: string
                  enum:
                    - all
                    - pantry
                    - refrigerator
                    - freezer
                    - low_stock
                    - opened
                    - unopened
                    - frozen
                    - recent
                defaultSort:
                  type: string
                  enum:
                    - expiry
                    - name
                    - quantity
                    - location
                    - updated
                    - added
                defaultGroup:
                  type: string
                  enum:
                    - none
                    - location
                    - category
                    - expiry
              required:
                - defaultView
                - defaultSort
                - defaultGroup
              additionalProperties: false
          required:
            - category
            - values
          additionalProperties: false
    ShoppingCartItemInput:
      type: object
      required: [item, quantity, unit, note]
      properties:
        item: { type: string, minLength: 1, maxLength: 160 }
        quantity:
          description: Required amount. Changing cartQuantity does not reduce this demand.
          oneOf:
            - { type: number, exclusiveMinimum: 0, maximum: 10000 }
            - { type: string, const: '' }
        unit: { type: string, maxLength: 30 }
        note: { type: string, maxLength: 240 }
        checked: { type: boolean, default: false }
        shoppingState:
          { type: string, enum: [to_buy, in_cart, cant_find, sourced], default: to_buy }
        cartQuantity: { type: number, minimum: 0, maximum: 10000 }
        cartUnit:
          {
            type: [string, 'null'],
            maxLength: 30,
            description: Purchase dimension independent of demand unit. Null legacy values require review before unpacking.,
          }
        cartLabel:
          { type: string, maxLength: 160, description: Scanned brand or chosen substitute label. }
        aisleId: { type: string }
        productId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        recommendationKey: { type: string, maxLength: 240 }
    MealPlanEntryInput:
      type: object
      required: [plannedFor, meal, servings, note]
      description: A recipe or named meal. Item meals require foodItem with an amount per serving. Leftovers require an existing source meal on or before this date, and do not create new grocery demand. Source servings must include leftover portions. Omitted kind, foodItem, and recipeOverride preserve existing metadata during updates; send the complete planned date, slot, recipe or title, servings, and note.
      properties:
        profileIds:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Household profile UUIDs for this meal. Empty means shared by the household.
          items: { type: string, format: uuid }
        options:
          type: array
          minItems: 2
          maxItems: 12
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string, enum: [recipe, pantry] }
              label: { type: string }
              recipeId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
        plannedFor: { type: string, format: date }
        meal: { type: string, minLength: 1, maxLength: 48, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        kind: { type: string, enum: [recipe, item, takeout, leftover, custom, fast, options] }
        recipeId: { type: string, description: 'Recipe UUID, or empty for non-recipe meals.' }
        title: { type: string, maxLength: 160, default: '' }
        servings: { type: integer, minimum: 1, maximum: 100 }
        note: { type: string, maxLength: 240 }
        leftoverSourceId: { type: [string, 'null'], format: uuid }
        foodItem:
          anyOf:
            - $ref: '#/components/schemas/PlannedFoodItem'
            - type: 'null'
        recipeOverride:
          description: Complete ingredients and steps for this planned meal only. The library recipe is unchanged. Nutrition is unknown after adaptation. Null restores the current library recipe.
          anyOf:
            - $ref: '#/components/schemas/PlannedRecipeOverride'
            - type: 'null'
    PlannedFoodItem:
      type: object
      required: [item, quantity, unit, note]
      properties:
        item: { type: string, minLength: 1, maxLength: 160 }
        quantity:
          oneOf:
            - { type: number, exclusiveMinimum: 0, maximum: 10000 }
            - { type: string, const: '' }
        unit: { type: string, maxLength: 30 }
        note: { type: string, maxLength: 240 }
        shoppingCategory: { type: string, default: Other }
        pantryProductId:
          { type: string, description: Pantry product UUID or empty to clear a match. }
    PlannedRecipeOverride:
      type: object
      required: [title, summary, servings, ingredientGroups, instructionSections]
      properties:
        cookingMethod: { type: string, maxLength: 80 }
        equipment: { type: array, maxItems: 30, items: { type: string, maxLength: 120 } }
        prepMinutes: { type: integer, minimum: 0, maximum: 10080 }
        cookMinutes: { type: integer, minimum: 0, maximum: 10080 }
        restMinutes: { type: integer, minimum: 0, maximum: 10080 }
        equipmentRequirements:
          {
            type: array,
            maxItems: 30,
            items: { $ref: '#/components/schemas/RecipeEquipmentRequirement' },
          }
        title: { type: string, minLength: 1, maxLength: 160 }
        summary: { type: string, maxLength: 800 }
        servings: { type: string, maxLength: 80 }
        ingredientGroups:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name, ingredients]
            properties:
              name: { type: string }
              ingredients:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/PlannedFoodItem' }
        instructionSections:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [title, steps]
            properties:
              title: { type: string }
              steps: { type: array, minItems: 1, items: { type: string } }
    MealPlanBatchInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 280
          items: { $ref: '#/components/schemas/MealPlanEntryInput' }
    RecipeCalculationInput:
      type: object
      properties:
        includedOptionalIngredientIds:
          default: []
          maxItems: 500
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        excludedIngredientIds:
          default: []
          maxItems: 500
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        substitutions:
          default: []
          maxItems: 500
          type: array
          items:
            type: object
            properties:
              recipeIngredientId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              productId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            required:
              - recipeIngredientId
              - productId
            additionalProperties: false
        preparationFactors:
          default: []
          maxItems: 500
          type: array
          items:
            type: object
            properties:
              recipeIngredientId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              ediblePortion:
                default: 1
                type: number
                exclusiveMinimum: 0
                maximum: 1
              drainedYield:
                default: 1
                type: number
                exclusiveMinimum: 0
                maximum: 1
              evidenceNote:
                type: string
                minLength: 1
                maxLength: 500
            required:
              - recipeIngredientId
              - evidenceNote
            additionalProperties: false
        finalWeightGrams:
          default: null
          anyOf:
            - type: number
              exclusiveMinimum: 0
              maximum: 1000000
            - type: 'null'
      additionalProperties: false
    ManualFoodNutritionInput:
      type: object
      properties:
        sourceRecordKey:
          default: ''
          type: string
          maxLength: 300
        basisType:
          type: string
          enum:
            - per_100g
            - per_100ml
            - per_serving
            - per_unit
        basisAmount:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
        basisUnit:
          type: string
          minLength: 1
          maxLength: 30
        servingWeightGrams:
          default: null
          anyOf:
            - type: number
              exclusiveMinimum: 0
              maximum: 1000000
            - type: 'null'
        densityGramsPerMilliliter:
          default: null
          anyOf:
            - type: number
              exclusiveMinimum: 0
              maximum: 1000000
            - type: 'null'
        pieceWeightGrams:
          default: null
          anyOf:
            - type: number
              exclusiveMinimum: 0
              maximum: 1000000
            - type: 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        completeness:
          type: number
          minimum: 0
          maximum: 1
        supersedesRecordId:
          default: null
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
        notes:
          default: ''
          type: string
          maxLength: 2000
        values:
          minItems: 1
          maxItems: 46
          type: array
          items:
            type: object
            properties:
              nutrientCode:
                type: string
                enum:
                  - energy_kcal
                  - energy_kj
                  - protein
                  - carbohydrate
                  - fiber
                  - total_sugars
                  - added_sugars
                  - sugar_alcohols
                  - total_fat
                  - saturated_fat
                  - monounsaturated_fat
                  - polyunsaturated_fat
                  - trans_fat
                  - omega_3
                  - omega_6
                  - cholesterol
                  - alcohol
                  - sodium
                  - potassium
                  - calcium
                  - iron
                  - magnesium
                  - phosphorus
                  - zinc
                  - copper
                  - manganese
                  - selenium
                  - iodine
                  - vitamin_a
                  - vitamin_c
                  - vitamin_d
                  - vitamin_e
                  - vitamin_k
                  - thiamin
                  - riboflavin
                  - niacin
                  - pantothenic_acid
                  - vitamin_b6
                  - biotin
                  - folate
                  - vitamin_b12
                  - choline
                  - water
                  - caffeine
                  - serving_weight
                  - edible_portion_weight
              amount:
                type: number
                minimum: 0
                maximum: 1000000000
              confidence:
                default: null
                anyOf:
                  - type: number
                    minimum: 0
                    maximum: 1
                  - type: 'null'
              sourceNote:
                default: ''
                type: string
                maxLength: 500
            required:
              - nutrientCode
              - amount
            additionalProperties: false
      required:
        - basisType
        - basisAmount
        - basisUnit
        - confidence
        - completeness
        - values
      additionalProperties: false

      x-api-permissions: ['pantry:read']
      operationId: exportPantryPdf
      summary: Print current pantry inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paper: { type: string, enum: [A4, Letter], default: A4 }
                format: { type: string, enum: [pdf, zip], default: pdf }
                includeNotes: { type: boolean, default: true }
                includeChecked: { type: boolean, default: false }
                includeDates: { type: boolean, default: true }
                countColumn: { type: boolean, default: true }
                organizeByStore: { type: boolean, default: false }
                storeId: { type: string, format: uuid }
                locationId: { type: string, format: uuid }
      responses:
        '200':
          description: Printable PDF or ZIP
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/UntrustedOrigin' }
        '404': { description: List not found }
        '413': { description: More than 2000 items }
        '429': { description: Print queue is busy }
  /shopping-lists/{listId}/export/pdf:

  /nutrition/profiles/{profileId}/intake/product:
    post:
      operationId: recordProductConsumption
      security: [{ SessionCookie: [] }]
      summary: Record a reviewed saved-food portion for an authorized person
      description: >-
        Session-only first-party command; API keys are not accepted. Requires the existing
        per-person manage-profile permission and exact trusted browser origin. No stock is consumed.
        expectedFoodNutritionRecordId pins a reviewed source. A changed preferred record returns409;
        corrections keep their original record. Transport failure is an unknown outcome: inspect
        the diary before another command, because this endpoint does not promise durable replay.
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductConsumptionRequest' }
      responses:
        '201':
          description: Saved intake revision with immutable food-record provenance
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { type: object, additionalProperties: true }
        '400': { description: Invalid portion or unsupported conversion }
        '401': { description: Sign in required }
        '403': { description: Person permission denied or untrusted origin }
        '404': { description: Record or person not found }
        '409': { description: Reviewed food record or correction changed; review again }
  /pantry/export/pdf:

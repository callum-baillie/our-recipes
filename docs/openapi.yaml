    KitchenCommand:
      type: object
      description: Add requires item and optional count; update requires item, itemId and expectedItemRevision; coverage requires coverage. Updates replace the reviewed item, omitted optional item fields reset to conservative defaults. operationId is immutable and replayed only for identical actor, kitchen and normalized intent.
      required: [kind, operationId, expectedRevision]
      properties:
        kind: { type: string, enum: [add, update, coverage, setup] }
        operationId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 1, maximum: 20, default: 1 }

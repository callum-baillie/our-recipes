openapi: 3.1.0
info:
  title: Bord API
  version: 1.0.0-rc.26
  description: >-
    Authenticated self-hosted household API. Browser sessions provide access to the Bord app.
    Admin-created bearer API keys may access only the documented Recipes, Meal Plans, Grocery
    Lists, Collections, Pantry, and workflow settings integration resources and are checked against per-resource
    read/create/update/delete scopes. Household profiles remain convenience identity inside an
    authenticated account and are not an authorization boundary.
  license:
    name: Private household use — see repository license decision before redistribution
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - SessionCookie: []
paths:
  /scanner/context:
    get:
      operationId: readScannerContext
      summary: Read the instance and actor binding for a registered scanner
      description: >-
        Scanner contract v2 binds instance, station, actor and key. UUID and frozen intent must
        survive uncertain delivery. Recipe cards record cooking immediately. Product preparation
        freezes exact saved package defaults; rejected operations retain permanent review receipts.
        Personal nutrition intake remains session-only and separate from cooking.
      security:
        - SessionCookie: []
        - ApiKeyBearer: []
      parameters:
        - name: stationId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acknowledged result; inspect outcome, replay status and binding
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: 'Malformed bounded input' }
        '401': { description: 'Authentication required' }
        '403': { description: 'Account, profile, scope, origin or binding rejected' }
        '404': { description: 'Owned resource unavailable' }
        '409':
          {
            description: 'Terminal review receipt or stale state; inspect outcome before correcting',
          }
        '413': { description: 'Request or response exceeds scanner limits' }
        '429': { description: 'Rate or print limit; retain intent and respect Retry-After' }
  /scanner/lookups:
    post:
      operationId: lookupScannerProduct
      summary: Read local product, exact package defaults or catalog candidates
      description: >-
        Scanner contract v2 binds instance, station, actor and key. UUID and frozen intent must
        survive uncertain delivery. Recipe cards record cooking immediately. Product preparation
        freezes exact saved package defaults; rejected operations retain permanent review receipts.
        Personal nutrition intake remains session-only and separate from cooking.
      security:
        - SessionCookie: []
        - ApiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScannerLookup' }
      responses:
        '200':
          description: Acknowledged result; inspect outcome, replay status and binding
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: 'Malformed bounded input' }
        '401': { description: 'Authentication required' }
        '403': { description: 'Account, profile, scope, origin or binding rejected' }
        '404': { description: 'Owned resource unavailable' }
        '409':
          {
            description: 'Terminal review receipt or stale state; inspect outcome before correcting',
          }
        '413': { description: 'Request or response exceeds scanner limits' }
        '429': { description: 'Rate or print limit; retain intent and respect Retry-After' }
  /scanner/operations:
    post:
      operationId: executeScannerOperation
      summary: Execute or replay one immutable actor-bound scanner operation
      description: >-
        Scanner contract v2 binds instance, station, actor and key. UUID and frozen intent must
        survive uncertain delivery. Recipe cards record cooking immediately. Product preparation
        freezes exact saved package defaults; rejected operations retain permanent review receipts.
        Personal nutrition intake remains session-only and separate from cooking.
      security:
        - SessionCookie: []
        - ApiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScannerBoundOperation' }
      responses:
        '200':
          description: Acknowledged result; inspect outcome, replay status and binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerReceipt' }
        '400': { description: 'Malformed bounded input' }
        '401': { description: 'Authentication required' }
        '403': { description: 'Account, profile, scope, origin or binding rejected' }
        '404': { description: 'Owned resource unavailable' }
        '409':
          description: Terminal bound review receipt or an unacknowledged state conflict
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ScannerReceipt' }
                  - {
                      type: object,
                      required: [error],
                      properties: { error: { type: object, additionalProperties: true } },
                    }

        '413': { description: 'Request or response exceeds scanner limits' }
        '429': { description: 'Rate or print limit; retain intent and respect Retry-After' }

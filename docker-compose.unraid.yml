services:
  bord:
    image: ghcr.io/callum-baillie/bord:latest
    container_name: bord
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATA_DIR: /data
      DATABASE_URL: /data/bord.db
      APP_ORIGIN: https://recipes.tower
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      COOKIE_SECRET: replace-with-a-unique-secret-of-at-least-32-characters
      TZ: America/Los_Angeles
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HOMEPAGE_INTEGRATION_TOKEN: ${HOMEPAGE_INTEGRATION_TOKEN:-}
      BACKUP_DIR: /backup
      BACKUP_INTERVAL_HOURS: 24
      BACKUP_RETENTION_DAYS: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_WORKER_ENABLED: ${AI_WORKER_ENABLED:-true}
      AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-10}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
      AI_BATCH_MIN_ITEMS: ${AI_BATCH_MIN_ITEMS:-2}
      BORD_FOOD_API_BASE_URL: ${BORD_FOOD_API_BASE_URL:-}
      BORD_FOOD_API_KEY: ${BORD_FOOD_API_KEY:-}
      BORD_FOOD_API_TIMEOUT_MS: ${BORD_FOOD_API_TIMEOUT_MS:-5000}
      FOOD_DATA_MODE: ${FOOD_DATA_MODE:-direct}
      FOOD_DATA_ALLOW_REMOTE_FALLBACK: ${FOOD_DATA_ALLOW_REMOTE_FALLBACK:-false}
      STORE_DIRECTORY_ENABLED: ${STORE_DIRECTORY_ENABLED:-false}
      USDA_FDC_BASE_URL: ${USDA_FDC_BASE_URL:-https://api.nal.usda.gov/fdc/v1}
      OPEN_FOOD_FACTS_BASE_URL: ${OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org}
      OPEN_FOOD_FACTS_ENABLED: ${OPEN_FOOD_FACTS_ENABLED:-true}
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
    volumes:
      - /mnt/user/appdata/bord:/data
      - /mnt/user/backups/bord:/backup

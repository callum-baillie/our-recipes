<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=393,initial-scale=1"><title>New recipe</title><link rel="stylesheet" href="styles.css"></head><body><div class="phone ">
      <div class="status-bar" style="color:#1F2F25">
      <div class="status-time">9:41</div>
      <div class="dynamic-island"></div>
      <div class="status-icons"><span class="signal"></span><span class="wifi">⌁</span><span class="battery"><i></i></span></div>
    </div>
      <div class="nav-bar"><div class="nav-slot left"><div class="nav-left"><div class="glass-button nav-circle" aria-label="Back"><svg class="icon " width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></div><span class="back-label">Cancel</span></div></div><div class="nav-center"><div class="nav-title">New recipe</div></div><div class="nav-slot right"><button class="nav-text primary-text">Save</button></div></div>
      <main class="screen-content"><div class="scroll pad form-screen">
      <header class="large-header compact">
      <div class="eyebrow">A RECIPE WORTH KEEPING</div>
      <h1>New recipe</h1>
      <p>Add the details you use at the stove. You can refine anything later.</p>
    </header>
      <div class="photo-placeholder card"><svg class="icon " width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg><strong>Add a cover photo</strong><small>Optional · helps the library scan faster</small></div>
      <div class="section-label">RECIPE CARD</div><div class="form-group fields-group">
        <label class="field-block"><span>Recipe name</span><div class="field"><span class="field-value placeholder">e.g. Sunday tomato soup</span></div></label>
        <label class="field-block"><span>Short note</span><div class="field"><span class="field-value placeholder">Why it belongs in your cookbook</span></div></label>
        <div class="two-fields"><label class="field-block"><span>Serves</span><div class="field"><span class="field-value">4</span></div></label><label class="field-block"><span>Prep time</span><div class="field"><span class="field-value">15 min</span></div></label></div>
        <div class="two-fields"><label class="field-block"><span>Cook time</span><div class="field"><span class="field-value">30 min</span></div></label><label class="field-block"><span>Meal</span><div class="field"><span class="field-value">Dinner</span><svg class="icon " width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></label></div>
      </div>

    </div><div class="bottom-save glass-bar"><button class="secondary grow">Save draft</button><button class="primary grow">Save recipe</button></div></main>
      
      <div class="home-indicator "></div>
    </div></body></html>

packages:
  - '.'

overrides:
  'postcss@^8': 8.5.23
  'next>sharp': 0.35.5
  'undici@^7': 7.29.1
  'js-yaml@^4': 4.3.2
  'nanoid@^3': 3.3.18
  'browserslist@^4': 4.28.7
  'baseline-browser-mapping@^2': 2.11.0
  'source-map-js@^1': 1.2.2

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
  sharp: true
  # This package's only install hook is OpenCollective messaging; the shipped
  # OCR runtime/model need no build step, so keep clean installs non-interactive.
  tesseract.js: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tar@7.5.21

# Avoid the Windows virtual-store linking path that lost package manifests during
# two clean installations. This changes local install mechanics only.
nodeLinker: hoisted
packageImportMethod: copy

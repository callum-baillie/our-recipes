# Optional Redis transport: docker compose -f docker-compose.yml -f docker-compose.queue.yml up -d
services:
  bord:
    environment:
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - bord-queue:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  bord-queue:

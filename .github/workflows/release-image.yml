name: Release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name == 'push' || inputs.publish == true }}
      platforms: linux/amd64,linux/arm64
      # Each architecture builds on its native runner, without QEMU emulation.
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      cache: true
      cache-mode: max
      cache-scope: bord-release
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository_owner }}/bord
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
        type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

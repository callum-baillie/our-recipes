name: Release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built image to GHCR
        required: true
        default: false
        type: boolean
      restore_latest_from:
        description: Restore the latest image tag from an existing versioned tag
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.restore_latest_from == ''
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.event_name == 'push' || inputs.publish == true }}
      platforms: linux/amd64,linux/arm64
      # Each architecture builds on its native runner, without QEMU emulation.
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      cache: true
      cache-mode: max
      cache-scope: bord-release
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository_owner }}/bord
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      meta-flavor: latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  restore-latest:
    name: Restore latest image tag
    if: github.event_name == 'workflow_dispatch' && inputs.restore_latest_from != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Restore latest to an existing versioned image
        env:
          SOURCE_TAG: ${{ inputs.restore_latest_from }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/bord
        run: |
          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "restore_latest_from must be a versioned vMAJOR.MINOR.PATCH image tag" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:$SOURCE_TAG"
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:latest" "$IMAGE_REPOSITORY:$SOURCE_TAG"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:latest"

  smoke:
    name: Container smoke (${{ matrix.platform }})
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published image on its native architecture
        env:
          DOCKER_SKIP_BUILD: 'true'
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/bord
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tag="$GITHUB_REF_NAME"
          else
            image_tag="sha-${GITHUB_SHA:0:7}"
          fi
          export DOCKER_IMAGE="$IMAGE_REPOSITORY:$image_tag"
          docker pull "$DOCKER_IMAGE"
          node scripts/docker-smoke.mjs
